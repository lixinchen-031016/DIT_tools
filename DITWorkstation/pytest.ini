[pytest]
# 测试分类与云端执行范围
# ---------------------------------------------------------------------------
# · 云端流水线：只执行 ci 标记的测试（合成数据 / mock / 临时目录 / offscreen Qt）。
#   CI workflow 与打包脚本显式传入 --ignore=DITWorkstationTests/local
#   和 -m "not local_only"；conftest 在 CI 环境下再从收集阶段忽略 local/ 目录。
# · 本地专属：local_only / requires_local_media / full_library_scan，
#   依赖本机私有素材、本机路径或人工条件，不进入云端执行范围。
# ---------------------------------------------------------------------------
testpaths = DITWorkstationTests
addopts = -ra --strict-markers

markers =
    ci: 适合云端流水线执行（合成数据、mock、临时目录、offscreen Qt，无本机资源依赖）
    local_only: 仅限本地运行（本机素材、本机路径或人工条件），CI 收集阶段排除
    requires_local_media: 依赖本机真实图片或 RAW 素材目录
    full_library_scan: 全量真实素材扫描，需显式环境变量开启且耗时较长
